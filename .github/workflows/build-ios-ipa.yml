name: Build PhoneBaseLocal IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "应用/本地基座-iOS/**"
      - ".github/workflows/build-ios-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    name: macOS-15-intel unsigned IPA (TrollStore)
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: 应用/本地基座-iOS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen + ldid
        run: brew install xcodegen ldid

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (no Apple signing)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project PhoneBaseLocal.xcodeproj \
            -scheme PhoneBaseLocal \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/PhoneBaseLocal.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Entitlements + Package IPA
        run: |
          set -euo pipefail
          APP="$(find build/PhoneBaseLocal.xcarchive/Products/Applications -name '*.app' -maxdepth 1 | head -n1)"
          test -n "$APP"
          BIN="$APP/PhoneBaseLocal"
          ENT="PhoneBaseLocal/PhoneBaseLocal.entitlements"
          test -f "$BIN"
          test -f "$ENT"
          # TrollStore 依赖 ldid 写入的 entitlements；无签名 IPA 否则权限不生效
          ldid -S"$ENT" "$BIN"
          cp "$ENT" "$APP/entitlements.plist"
          # 便于核对构建号
          strings "$BIN" | grep -E 'local-rebuild-0\.1\.|BSD listen ready' | head -n 20 || true
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (
            cd build
            zip -qry "PhoneBaseLocal-unsigned.ipa" Payload
          )
          ls -lh build/PhoneBaseLocal-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneBaseLocal-unsigned-ipa
          path: 应用/本地基座-iOS/build/PhoneBaseLocal-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
